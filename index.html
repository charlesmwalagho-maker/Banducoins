<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banducoins</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;padding:20px;text-align:center}
.card{background:#1e293b;padding:20px;border-radius:15px;margin:10px auto;max-width:400px}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;font-size:16px;box-sizing:border-box}
input{background:#0f172a;color:white;border:1px solid #334155}
button{background:#22c55e;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#3b82f6}
button.red{background:#ef4444}
.hidden{display:none}
.item{background:#0f172a;padding:12px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.pochi{background:#fef3c7;color:black;padding:12px;border-radius:10px;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<h1>🪙 Banducoins</h1>

<div id="authCard" class="card">
<h2>Login / Sign Up</h2>
<input id="phone" placeholder="Phone e.g 0720832769">
<input id="password" type="password" placeholder="Password">
<button onclick="doSignup()">Sign Up</button>
<button class="secondary" onclick="doLogin()">Login</button>
<p id="authMsg"></p>
</div>

<div id="mainCard" class="card hidden">
<h2 id="welcome"></h2>
<h1>🪙 <span id="bal">0</span> Coins</h1>
<p id="userPhone"></p>
<button onclick="refreshBalance()">Refresh Balance</button>
<button class="secondary" onclick="showBuy()">Buy Coins - M-PESA</button>
<button class="red" onclick="logout()">Logout</button>
</div>

<div id="buyCard" class="card hidden">
<h2>Buy Coins</h2>
<p>1. Send money to Pochi La Biashara:</p>
<div class="pochi">📱 0720832769</div>
<p>2. Copy your M-PESA code, paste below</p>
<p>3. Send screenshot to admin on WhatsApp</p>
<input id="mpesaCode" placeholder="e.g QK123ABC...">
<input id="buyAmount" type="number" placeholder="Amount in Ksh e.g 100">
<button onclick="submitBuy()">I Have Paid</button>
<button class="secondary" onclick="hideBuy()">Back</button>
<p id="buyMsg"></p>
</div>

<div id="shopCard" class="card hidden">
<h2>Shop - Spend Coins</h2>
<div class="item"><span>⚡ 100 Coins - Boost</span><button onclick="buyItem('Boost',100)">Buy</button></div>
<div class="item"><span>🛡️ 200 Coins - Shield</span><button onclick="buyItem('Shield',200)">Buy</button></div>
<div class="item"><span>👑 500 Coins - VIP Skin</span><button onclick="buyItem('VIP Skin',500)">Buy</button></div>
<p id="shopMsg"></p>
</div>

<script>
let currentPhone = localStorage.getItem('phone') || '';
async function doSignup(){
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value.trim();
  if(!phone || !password){ document.getElementById('authMsg').innerText = 'Fill Phone AND Password'; return; }
  document.getElementById('authMsg').innerText = 'Creating account...';
  const res = await fetch('/.netlify/functions/signup',{method:'POST',body:JSON.stringify({phone,password,gameName:'Player'})});
  const data = await res.json();
  if(data.error){ document.getElementById('authMsg').innerText = data.error; return; }
  currentPhone = phone;
  localStorage.setItem('phone', phone);
  localStorage.setItem('savedPass', password);
  showMain(phone, 0);
  document.getElementById('authMsg').innerText = '';
}
async function doLogin(){
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value.trim() || localStorage.getItem('savedPass') || '';
  if(!phone || !password){ document.getElementById('authMsg').innerText = 'Enter Phone and Password'; return; }
  document.getElementById('authMsg').innerText = 'Logging in...';
  const res = await fetch('/.netlify/functions/login',{method:'POST',body:JSON.stringify({phone,password})});
  const data = await res.json();
  if(data.error){ document.getElementById('authMsg').innerText = data.error; return; }
  currentPhone = phone;
  localStorage.setItem('phone', phone);
  localStorage.setItem('savedPass', password);
  showMain(data.gameName || phone, data.coins ?? data.balance ?? 0);
}
function showMain(name, coins){
  document.getElementById('authCard').classList.add('hidden');
  document.getElementById('mainCard').classList.remove('hidden');
  document.getElementById('shopCard').classList.remove('hidden');
  document.getElementById('welcome').innerText = 'Hi ' + name;
  document.getElementById('bal').innerText = coins;
  document.getElementById('userPhone').innerText = currentPhone;
}
async function refreshBalance(){
  const res = await fetch('/.netlify/functions/get-balance',{method:'POST',body:JSON.stringify({phone:currentPhone})});
  const data = await res.json();
  if(data.coins !== undefined) document.getElementById('bal').innerText = data.coins;
  if(data.balance !== undefined) document.getElementById('bal').innerText = data.balance;
}
function showBuy(){ document.getElementById('buyCard').classList.remove('hidden'); }
function hideBuy(){ document.getElementById('buyCard').classList.add('hidden'); }
async function submitBuy(){
  const code = document.getElementById('mpesaCode').value;
  const amount = document.getElementById('buyAmount').value;
  if(!code || !amount){ document.getElementById('buyMsg').innerText = 'Paste M-PESA Code and Amount'; return; }
  document.getElementById('buyMsg').innerText = 'Request noted! Code: ' + code + ' Amount: Ksh ' + amount + '. Send screenshot to 0720832769, admin will approve.';
}
async function buyItem(item, cost){
  const res = await fetch('/.netlify/functions/spend',{method:'POST',body:JSON.stringify({phone:currentPhone, amount:cost, item})});
  const data = await res.json();
  if(data.error){ document.getElementById('shopMsg').innerText = data.error; return; }
  document.getElementById('shopMsg').innerText = 'You bought ' + item + '!';
  document.getElementById('bal').innerText = data.newBalance ?? data.balance ?? data.coins;
}
function logout(){ localStorage.removeItem('phone'); localStorage.removeItem('savedPass'); location.reload(); }
if(currentPhone){ document.getElementById('phone').value = currentPhone; const sp = localStorage.getItem('savedPass'); if(sp) document.getElementById('password').value = sp; }
</script>
</body>
</html>
