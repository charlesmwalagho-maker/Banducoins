<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANDUCOINS</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#050505;color:#fff;margin:0}
.top{padding:14px;display:flex;justify-content:space-between;background:#0a0a0a}
.logo{font-weight:900;font-size:20px}.logo span{color:#a3e635}
.wrap{max-width:480px;margin:auto;padding:14px;padding-bottom:90px}
.card{background:#111;border:1px solid #333;border-radius:16px;padding:16px;margin-bottom:14px}
input,textarea{width:100%;padding:13px;background:#000;border:1px solid #333;color:#fff;border-radius:12px;margin-top:10px;font-size:16px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px}
.gold{background:linear-gradient(90deg,#facc15,#a3e635);color:#000}
.dark{background:#222;color:#fff}
.hidden{display:none}
.big{font-size:40px;font-weight:900;color:#facc15}
.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:11px;border-radius:10px;background:#111;color:#fff;border:1px solid #333;font-weight:800}.tabs button.active{background:#facc15;color:#000}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;display:flex;max-width:480px;margin:auto;border-top:1px solid #222}
.bottom button{flex:1;background:none;border:none;color:#888;padding:12px;font-weight:800}.bottom button.active{color:#facc15}
.post{border:1px solid #222;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#0f0f0f}
.post img,.post video{width:100%;display:block}
</style>
</head>
<body>
<div class="top"><div class="logo">BANDU<span>COINS</span> 🪙</div><div>🪙 <span id="balTop">0</span></div></div>
<div class="wrap">

<!-- LOGIN -->
<div id="authCard" class="card">
<h2 style="text-align:center">Welcome to BANDUCOINS</h2>
<p style="color:#888;text-align:center;font-size:13px">Create account, post, buy coins</p>
<input id="phone" placeholder="Phone e.g 0798486530" type="tel">
<input id="password" placeholder="Password" type="password">
<input id="username" placeholder="Name e.g Wizzy">
<button class="btn gold" id="createBtn">CREATE ACCOUNT</button>
<button class="btn dark" id="loginBtn">LOGIN</button>
<p id="authMsg" style="text-align:center;color:#888"></p>
</div>

<!-- MAIN - HIDDEN UNTIL LOGIN -->
<div id="main" class="hidden">
<div class="tabs">
<button id="tProfile" class="active">👤 PROFILE</button>
<button id="tFeed">🎬 FEED</button>
<button id="tCoins">🪙 BUY COINS</button>
</div>

<div id="tab-profile">
<div class="card">
<h2 id="displayName">@user</h2><p id="userPhone" style="color:#888"></p>
<p style="color:#a3e635;font-size:12px">MY BALANCE COINS</p>
<div class="big"><span id="balance">0</span> COINS</div>
<button class="btn gold" id="goCoinsBtn">+ BUY COINS</button>
</div>
<div class="card">
<p style="color:#a3e635;font-size:12px">POST PICTURE OR VIDEO</p>
<textarea id="caption" rows="2" placeholder="Write something..."></textarea>
<input type="file" id="postFile" accept="image/*,video/*">
<button class="btn gold" id="postBtn" style="background:#a3e635">📤 POST NOW</button>
<p id="postMsg" style="text-align:center;color:#888"></p>
</div>
<div class="card"><p style="color:#a3e635;font-size:12px">MY POSTS</p><div id="myPosts"></div></div>
<button class="btn dark" id="logoutBtn">LOGOUT</button>
</div>

<div id="tab-feed" class="hidden">
<div class="card"><h3>FEED</h3><p style="color:#888">Videos cost coins. Pictures are FREE.</p></div>
<div id="feedList"></div>
</div>

<div id="tab-coins" class="hidden">
<div class="card">
<h3>BUY BANDUCOINS - ONLY COINS, NO BUNDLES</h3>
<p>Balance: <b id="balance2">0</b> Coins</p>
<button class="btn dark" onclick="buyCoins(450,20)">🪙 450 Coins - 20 KSh</button>
<button class="btn dark" onclick="buyCoins(600,30)">🪙 600 Coins - 30 KSh</button>
<button class="btn dark" onclick="buyCoins(1000,50)">🪙 1000 Coins - 50 KSh</button>
<button class="btn dark" onclick="buyCoins(2500,100)">🪙 2500 Coins - 100 KSh</button>
<p id="payMsg" style="text-align:center;color:#888">Pay with M-PESA via Pesapal. Shows BANDUCOINS.</p>
</div>
</div>
</div>
</div>

<div class="bottom" id="bottomNav" style="display:none">
<button id="bProfile" class="active">👤<br>PROFILE</button>
<button id="bFeed">🎬<br>FEED</button>
<button id="bCoins">🪙<br>BUY COINS</button>
</div>

<script>
// THIS IS THE FIX - NO WAITING FOR SERVER
var coins = 100;
var myPosts = [];
var unlocked = [];
var currentUser = "";
var userName = "";

function updateUI(){
  document.getElementById("balance").innerText = coins;
  document.getElementById("balTop").innerText = coins;
  document.getElementById("balance2").innerText = coins;
  document.getElementById("displayName").innerText = userName;
  document.getElementById("userPhone").innerText = currentUser;
  var html = "";
  for(var i=0;i<myPosts.length;i++){
    var p = myPosts[i];
    if(p.type=="image") html += '<div class="post"><img src="'+p.url+'"><div style="padding:10px">'+p.caption+'</div></div>';
    else html += '<div class="post"><video controls src="'+p.url+'"></video><div style="padding:10px">'+p.caption+'</div></div>';
  }
  document.getElementById("myPosts").innerHTML = html;
  document.getElementById("feedList").innerHTML = html || '<p style="color:#888;text-align:center">No posts yet. Post one!</p>';
}

function showTab(name){
  document.getElementById("tab-profile").classList.toggle("hidden", name!="profile");
  document.getElementById("tab-feed").classList.toggle("hidden", name!="feed");
  document.getElementById("tab-coins").classList.toggle("hidden", name!="coins");
  document.getElementById("tProfile").classList.toggle("active", name=="profile");
  document.getElementById("tFeed").classList.toggle("active", name=="feed");
  document.getElementById("tCoins").classList.toggle("active", name=="coins");
  document.getElementById("bProfile").classList.toggle("active", name=="profile");
  document.getElementById("bFeed").classList.toggle("active", name=="feed");
  document.getElementById("bCoins").classList.toggle("active", name=="coins");
}

function doCreate(){
  alert("Button clicked! Creating account...");
  var phone = document.getElementById("phone").value;
  var pass = document.getElementById("password").value;
  var name = document.getElementById("username").value;
  if(!phone){ document.getElementById("authMsg").innerText = "Enter phone"; return; }
  if(!pass){ document.getElementById("authMsg").innerText = "Enter password"; return; }
  currentUser = phone;
  userName = name || ("@"+phone.slice(-4));
  // Save on phone only - NO SERVER WAIT
  try{ localStorage.setItem("bandu_phone", phone); localStorage.setItem("bandu_name", userName); }catch(e){}
  document.getElementById("authMsg").innerText = "Account created! Welcome " + userName;
  document.getElementById("authCard").classList.add("hidden");
  document.getElementById("main").classList.remove("hidden");
  document.getElementById("bottomNav").style.display = "flex";
  updateUI();
  // Try server in background, ignore if it fails
  fetch("/.netlify/functions/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:phone,password:pass})}).catch(function(){});
}

function doLogin(){
  var phone = document.getElementById("phone").value;
  var pass = document.getElementById("password").value;
  if(!phone || !pass){ document.getElementById("authMsg").innerText = "Enter phone and password"; return; }
  currentUser = phone;
  userName = document.getElementById("username").value || ("@"+phone.slice(-4));
  try{ localStorage.setItem("bandu_phone", phone); localStorage.setItem("bandu_name", userName); }catch(e){}
  document.getElementById("authCard").classList.add("hidden");
  document.getElementById("main").classList.remove("hidden");
  document.getElementById("bottomNav").style.display = "flex";
  updateUI();
}

function buyCoins(c, amt){
  if(confirm("Pay "+amt+" KSh for "+c+" Coins via Pesapal? Tap OK to test.")){
    coins = coins + c;
    updateUI();
    document.getElementById("payMsg").innerText = "✅ "+c+" Coins added! Balance: "+coins;
    showTab("profile");
  }
}

document.getElementById("createBtn").addEventListener("click", doCreate);
document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("tProfile").addEventListener("click", function(){ showTab("profile"); });
document.getElementById("tFeed").addEventListener("click", function(){ showTab("feed"); });
document.getElementById("tCoins").addEventListener("click", function(){ showTab("coins"); });
document.getElementById("bProfile").addEventListener("click", function(){ showTab("profile"); });
document.getElementById("bFeed").addEventListener("click", function(){ showTab("feed"); });
document.getElementById("bCoins").addEventListener("click", function(){ showTab("coins"); });
document.getElementById("goCoinsBtn").addEventListener("click", function(){ showTab("coins"); });
document.getElementById("logoutBtn").addEventListener("click", function(){ try{localStorage.removeItem("bandu_phone");}catch(e){} location.reload(); });
document.getElementById("postBtn").addEventListener("click", function(){
  var f = document.getElementById("postFile").files[0];
  if(!f){ document.getElementById("postMsg").innerText = "First choose a picture or video"; return; }
  var r = new FileReader();
  r.onload = function(){
    var type = f.type.indexOf("video")>=0 ? "video" : "image";
    myPosts.unshift({url:r.result, type:type, caption:document.getElementById("caption").value});
    document.getElementById("postMsg").innerText = "✅ Posted!";
    document.getElementById("caption").value = "";
    updateUI();
    showTab("feed");
  };
  r.readAsDataURL(f);
});

// Auto-login if already created
try{
  var saved = localStorage.getItem("bandu_phone");
  if(saved){
    currentUser = saved;
    userName = localStorage.getItem("bandu_name") || ("@"+saved.slice(-4));
    document.getElementById("authCard").classList.add("hidden");
    document.getElementById("main").classList.remove("hidden");
    document.getElementById("bottomNav").style.display = "flex";
    updateUI();
  }
}catch(e){}
</script>
</body>
</html>
