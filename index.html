<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANDUCOINS</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#111;position:sticky;top:0;z-index:10}
.top b{font-size:20px;color:gold} .top span{font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:10px}
.tab{flex:1;min-width:90px;padding:10px;border:none;border-radius:20px;background:#222;color:#fff;font-weight:bold}
.tab.active{background:gold;color:#000}
.card{background:#111;margin:10px;padding:15px;border-radius:15px}
.profile-pic{width:90px;height:90px;border-radius:50%;background:#222;border:3px solid gold;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.profile-pic img{width:100%;height:100%;object-fit:cover}
.big{font-size:34px;color:gold;font-weight:bold;margin:5px 0}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin:8px 0}
.btn-gold{background:gold;color:#000} .btn-green{background:#7ac142;color:#000} .btn-grey{background:#222;color:#fff}
input,select,textarea{width:100%;padding:13px;margin:8px 0;background:#222;border:1px solid #333;color:#fff;border-radius:12px}
.coin-btn{display:block;width:100%;padding:14px;margin:8px 0;background:#222;color:#fff;border:1px solid #444;border-radius:12px;font-size:16px;text-align:left}
.coin-btn.selected{background:gold!important;color:#000!important;border:2px solid #fff;font-weight:bold}
.summary{display:none;background:#1a1a1a;border:2px solid gold;padding:15px;margin-top:15px;border-radius:12px;text-align:center}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111;border-top:1px solid #222;padding:8px}
.bottom button{flex:1;background:none;border:none;color:#aaa;font-weight:bold}
.bottom button.active{color:gold}
.hidden{display:none} .page{padding-bottom:80px}
</style>
</head>
<body>

<div class="top"><b>BANDUCOINS 🪙</b><span>🪙 <span id="topBal">40</span> | 💰 <span id="topEarn">0</span></span></div>

<!-- PROFILE PAGE -->
<div id="page-profile" class="page">
  <div class="tabs">
    <button class="tab active" onclick="showPage('profile')">👤 PROFILE</button>
    <button class="tab" onclick="showPage('spend')">🪙 SPEND</button>
    <button class="tab" onclick="showPage('live')">🔴 LIVE</button>
    <button class="tab" onclick="showPage('earn')">💰 EARN</button>
    <button class="tab" onclick="showPage('buy')">
